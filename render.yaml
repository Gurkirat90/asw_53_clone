# Render Blueprint for the Fiftythree API (Docker + persistent disk for SQLite).
# The frontend deploys to Vercel; see README, "Deployment".
services:
  - type: web
    name: fiftythree-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Persistent disks require a paid instance type on Render.
    plan: starter
    region: oregon
    numInstances: 1
    healthCheckPath: /healthz
    disk:
      name: fiftythree-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////data/fiftythree.db
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: ENABLE_DOCS
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: DEMO_USER_EMAIL
        value: demo@example.test
      - key: DEMO_USER_DISPLAY_NAME
        value: Demo User
      # Set in the Render dashboard: a shareable demo password (it is shown to reviewers).
      - key: DEMO_USER_PASSWORD
        sync: false
      # Set in the Render dashboard: the frontend origin, e.g. https://fiftythree.vercel.app
      - key: TRUSTED_ORIGINS
        sync: false
      - key: SEED_DEMO_DATA
        value: "true"
