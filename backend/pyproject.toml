# Tool configuration only. Dependencies live in requirements*.txt.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# backend/alembic/ is a migrations folder, not the alembic package.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-ra"
